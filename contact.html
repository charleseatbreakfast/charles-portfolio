<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f0d" />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="Connect with Charles Chau about product design opportunities, projects and conversations."
    />
    <title>Contact — Charles Chau</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/site-header.css" />
    <link rel="stylesheet" href="styles/contact.css" />
  </head>
  <body>
    <main class="contact-page" id="contact">
      <div class="contact-backdrop" aria-hidden="true"></div>
      <div class="contact-grain" aria-hidden="true"></div>

      <site-header active="contact"></site-header>

      <section class="contact-content" aria-labelledby="contact-title">
        <header class="contact-intro">
          <p class="contact-eyebrow">Let&rsquo;s connect</p>
          <h1 id="contact-title">Have a project, opportunity or conversation in mind?</h1>
        </header>

        <ul class="contact-links" aria-label="Contact methods">
          <li>
            <a
              href="https://wa.me/85261832914"
              target="_blank"
              rel="noopener noreferrer"
            >WhatsApp</a>
          </li>
          <li>
            <a
              href="https://www.linkedin.com/in/yiu-ho-chau-556b82239/?isSelfProfile=true"
              target="_blank"
              rel="noopener noreferrer"
            >LinkedIn</a>
          </li>
          <li>
            <button
              class="contact-link contact-link--email"
              type="button"
              data-email-copy="yiuhochau@gmail.com"
              aria-label="Copy email address yiuhochau@gmail.com"
              aria-describedby="email-copy-status"
            >
              <span class="contact-link__label">Email</span>
              <span class="contact-link__detail">yiuhochau@gmail.com</span>
            </button>
          </li>
        </ul>
        <p class="contact-copy-status" id="email-copy-status" aria-live="polite"></p>
      </section>
    </main>

    <script src="site-header.js?v=20261007work"></script>
    <script src="contact.js"></script>
  </body>
</html>
